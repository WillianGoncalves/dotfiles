# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# resize
set -g @tmux-nvim-resize true
set -g @tmux-nvim-resize-step-x 1
set -g @tmux-nvim-resize-step-y 1
set -g @tmux-nvim-resize-keybinding-left 'M-h'
set -g @tmux-nvim-resize-keybinding-down 'M-j'
set -g @tmux-nvim-resize-keybinding-up 'M-k'
set -g @tmux-nvim-resize-keybinding-right 'M-l'

# Configurations
# https://github.com/tmux/tmux/issues/1246#issue-292083184
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g allow-rename off

# Renumber windows when one is removed.
set -g renumber-windows on

set -g status-position bottom
set -g status-interval 4
set -g status-justify centre # center align window list

# Left status bar
set -g status-left ' #S '

# Right status bar
set -g status-right '%a, %d %b %Y %R '

set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '

set -g mode-keys vi
# Copy to system clipboard using wl-copy (for Wayland)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# --- Mouse: scroll, selection and click ---
set -g mouse on
set -g history-limit 50000

# Releasing the mouse after a drag copies to the system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy"

# Double click copies the word, triple click copies the line
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear "wl-copy"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear "wl-copy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear "wl-copy"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send -X select-line \; send -X copy-pipe-no-clear "wl-copy"

# A single click clears the selection instead of leaving copy mode
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection

# --- Ctrl+End: jump back to the bottom (leave scrollback) ---
bind -T copy-mode-vi C-End send -X cancel
bind -n C-End if -F '#{pane_in_mode}' 'send -X cancel' 'send-keys C-End'

# Also copy via OSC 52 (useful over SSH)
set -g set-clipboard on

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
